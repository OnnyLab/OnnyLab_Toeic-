<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login - Vocab Onny
  </title>

  <link
    rel="stylesheet"
    href="./css/login/main.css"
  >

</head>


<body>


  <main class="login-page">


    <!-- =========================================
         BACKGROUND DECORATION
    ========================================== -->

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>

    <div class="background-circle circle-three"></div>



    <!-- LEFT DECORATIONS -->

    <div class="decoration decoration-star">
      ★
    </div>


    <div class="decoration decoration-az">
      A-Z
    </div>


    <div class="decoration decoration-book">
      📖
    </div>



    <!-- RIGHT DECORATIONS -->

    <div class="decoration decoration-cap">
      🎓
    </div>


    <div class="decoration decoration-toeic">
      TOEIC
    </div>


    <div class="decoration decoration-star-right">
      ★
    </div>



    <!-- =========================================
         LOGIN CARD
    ========================================== -->

    <section class="login-card">


      <!-- =========================================
           BRAND
      ========================================== -->

      <div class="brand">

        <img
          src="./assets/brand/onnylab-wordmark.png"
          alt="Onnylab"
          class="brand-image"
        >

      </div>



      <!-- =========================================
           HEADING
      ========================================== -->

      <div class="login-heading">


        <h1>

          START YOUR

          <span>
            TOEIC JOURNEY
          </span>

        </h1>


        <p>
          Elevate your score, one word at a time.
          Enter your credentials to continue.
        </p>


      </div>



      <!-- =========================================
           LOGIN FORM
      ========================================== -->

      <form
        id="loginForm"
        class="login-form"
        novalidate
      >


        <!-- EMAIL -->

        <div class="form-group">


          <label for="email">
            Email
          </label>


          <div class="input-wrapper">


            <span class="input-icon">
              ✉
            </span>


            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >


          </div>


        </div>



        <!-- PASSWORD -->

        <div class="form-group">


          <label for="password">
            Password
          </label>


          <div class="input-wrapper password-wrapper">


            <span class="input-icon">
              🔒
            </span>


            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >


            <button
              id="togglePassword"
              class="toggle-password"
              type="button"
              aria-label="Show password"
            >

              <span id="togglePasswordText">
                Show
              </span>

              <span class="eye-icon">
                ◉
              </span>

            </button>


          </div>



          <!-- FORGOT PASSWORD -->

          <div class="forgot-password-row">

            <button
              id="forgotPasswordBtn"
              class="text-button"
              type="button"
            >
              Forgot password?
            </button>

          </div>


        </div>



        <!-- =========================================
             MESSAGE
        ========================================== -->

        <div
          id="loginMessage"
          class="login-message"
          aria-live="polite"
        >
        </div>



        <!-- =========================================
             LOGIN BUTTON
        ========================================== -->

        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >


          <span id="loginButtonText">
            SIGN IN & PLAY
          </span>


          <span class="login-arrow">
            →
          </span>


        </button>


      </form>



      <!-- =========================================
           DIVIDER
      ========================================== -->

      <div class="divider">


        <span></span>


        <small>
          OR
        </small>


        <span></span>


      </div>



      <!-- =========================================
           SIGN UP
      ========================================== -->

      <div class="signup-row">


        <span>
          Don't have an account?
        </span>


        <button
          id="signUpBtn"
          class="signup-button"
          type="button"
        >
          Sign Up
        </button>


      </div>


    </section>



    <!-- =========================================
         SLOGAN
    ========================================== -->

    <div class="login-slogan">

      <span>
        Learn
      </span>

      <i>
        •
      </i>

      <span>
        Practice
      </span>

      <i>
        •
      </i>

      <span>
        Improve
      </span>

      <i>
        •
      </i>

      <span>
        Achieve
      </span>

    </div>



    <div class="side-slogan">

      Better Words
      <br>
      Brighter Future

    </div>


  </main>



  <script
    type="module"
    src="./js/core/login.js"
  ></script>


</body>

</html>
