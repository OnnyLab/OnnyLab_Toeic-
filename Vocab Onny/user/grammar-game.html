<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grammar Practice - OnnyLab</title>
  <link rel="stylesheet" href="../css/shared/user-theme.css">
  <link rel="stylesheet" href="../css/user/grammar.css?v=20261002-4">
  <link rel="stylesheet" href="../css/user/user-polish.css">
</head>
<body class="grammar-game-page">

  <header class="grammar-arena-header">
    <a class="grammar-arena-brand" href="./practice.html">
      <img src="../assets/brand/logo.png" alt="Onnylab">
      <div>
        <strong>Onnylab</strong>
        <span>Grammar Practice</span>
      </div>
    </a>

    <a class="grammar-exit-link" href="./practice.html#grammar-practice">
      Exit Practice
    </a>
  </header>

  <main class="grammar-game-shell">

    <aside class="grammar-mode-panel">
      <div class="grammar-mode-visual">
        <img src="../assets/brand/logo.png" alt="" aria-hidden="true">
      </div>

      <span class="grammar-side-kicker">GRAMMAR MODE</span>
      <h1 id="grammarModeTitle">Tenses Practice</h1>
      <p id="grammarModeDescription">
        ฝึกเลือกโครงสร้างประโยคให้ถูกต้องจากสถานการณ์จริง
      </p>

      <div class="grammar-mode-meta">
        <div>
          <small>Mode</small>
          <strong id="grammarModeShort">Tenses</strong>
        </div>
        <div>
          <small>Questions</small>
          <strong id="grammarModeQuestionCount">0</strong>
        </div>
        <div>
          <small>Score</small>
          <strong id="grammarScoreValue">0</strong>
        </div>
        <div>
          <small>Correct</small>
          <strong id="grammarCorrectValue">0</strong>
        </div>
        <div>
          <small>Wrong</small>
          <strong id="grammarWrongValue">0</strong>
        </div>
        <div>
          <small>Timeout</small>
          <strong id="grammarTimeoutValue">0</strong>
        </div>
      </div>

      <a class="grammar-switch-mode" href="./practice.html#grammar-practice">
        ← Change Mode
      </a>
    </aside>

    <section class="grammar-play-panel">

      <div class="grammar-game-top">
        <div>
          <span class="grammar-play-kicker">CURRENT SESSION</span>
          <strong id="grammarPlayTitle">Grammar Practice</strong>
        </div>

        <div class="grammar-session-actions">
          <button
            id="grammarPauseBtn"
            class="grammar-pause-button"
            type="button"
          >
            ⏸ Pause
          </button>

          <span class="grammar-progress-copy" id="grammarProgressCopy">
            0 / 0
          </span>
        </div>
      </div>

      <div class="grammar-progress">
        <div id="grammarProgressBar"></div>
      </div>

      <section id="grammarGameArea" class="grammar-game-area">
        <article class="grammar-empty-card">
          <div class="grammar-loading-mark">G</div>
          <h1>Loading Grammar Practice...</h1>
          <p>กำลังเตรียมโจทย์ให้คุณ</p>
        </article>
      </section>

    </section>

  </main>

  <script type="module" src="../js/user/grammar-game.js?v=20261002-4"></script>
</body>
</html>
